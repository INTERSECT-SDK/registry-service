# Example values for umbrella-chart usage where a shared Secret already exists.
#
# This expects a Secret in the target namespace:
#   metadata.name: intersect-shared-secrets
#   data.REGISTRY_SECRET_NAME:    <base64 encoded internal secret, >= 16 chars>
#   data.KEYCLOAK_CLIENT_SECRET:  <base64 encoded OIDC client secret>
#   data.SESSION_SECRET:          <base64 encoded session signing key>
#   data.BROKER_ROOT_PASSWORD:    <base64 encoded broker root password>
#   data.BROKER_CLIENT_PASSWORD:  <base64 encoded broker client password>
#   data.BROKER_CLIENT_API_KEY:   <base64 encoded broker client API key>
#   data.POSTGRESQL_PASSWORD:     <base64 encoded database password>

app:
  systemName: intersect-registry-system
  secretName:
    isSecret: true
    secretName: intersect-shared-secrets
    secretKey: REGISTRY_SECRET_NAME

auth:
  implementation: keycloak
  keycloak:
    realmBaseUrl: "https://keycloak.example.com/realms/intersect/protocol/openid-connect"
    scope: "openid email"
    clientId: registry-service
    clientSecret:
      isSecret: true
      secretName: intersect-shared-secrets
      secretKey: KEYCLOAK_CLIENT_SECRET
  session:
    secret:
      isSecret: true
      secretName: intersect-shared-secrets
      secretKey: SESSION_SECRET

broker:
  host: release-intersect-message-broker-1
  port: 5672
  protocol: amqp0.9.1
  application: rabbitmq
  managementUri: "http://release-intersect-message-broker-1:15672/"
  root:
    username: intersect_username
    password:
      isSecret: true
      secretName: intersect-shared-secrets
      secretKey: BROKER_ROOT_PASSWORD
  client:
    username: lackey
    password:
      isSecret: true
      secretName: intersect-shared-secrets
      secretKey: BROKER_CLIENT_PASSWORD
    apiKey:
      isSecret: true
      secretName: intersect-shared-secrets
      secretKey: BROKER_CLIENT_API_KEY

postgresql:
  enabled: true
  auth:
    username: registry_username
    password:
      isSecret: true
      secretName: intersect-shared-secrets
      secretKey: POSTGRESQL_PASSWORD
    database: registry
