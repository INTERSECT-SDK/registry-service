# Example values with every credential supplied inline.
#
# Suitable for a development cluster. For anything else, prefer
# values-umbrella-existing-secret.yaml so credentials live in a Secret.

app:
  systemName: intersect-registry-system
  secretName:
    isSecret: false
    hardcoded: "changemechangeme01"

auth:
  implementation: keycloak
  keycloak:
    realmBaseUrl: "http://keycloak:8080/realms/DevRegistryKeycloak/protocol/openid-connect"
    scope: "openid email"
    clientId: registry-service-dev
    clientSecret:
      isSecret: false
      hardcoded: "oOwbABbnGEwRlXU3HzCgspBtWfwIiIfQ"
  session:
    secret:
      isSecret: false
      hardcoded: "01020304050607080910111213141516"

broker:
  host: broker
  port: 5672
  protocol: amqp0.9.1
  application: rabbitmq
  managementUri: "http://broker:15672/"
  root:
    username: intersect_username
    password:
      isSecret: false
      hardcoded: intersect_password
  client:
    username: lackey
    password:
      isSecret: false
      hardcoded: lackey
    apiKey:
      isSecret: false
      hardcoded: fakeapikey

postgresql:
  enabled: true
  auth:
    username: registry_username
    password:
      isSecret: false
      hardcoded: registry_password
    database: registry
